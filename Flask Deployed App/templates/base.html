<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/2.0.1/css/ionicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bttn.css/0.2.4/bttn.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <meta name="theme-color" content="#10B981">
    <title>{% block pagetitle %}{% endblock pagetitle %}</title>
    <style>
        :root {
            --emerald: #10B981;
            --emerald-dark: #059669;
            --emerald-light: #D1FAE5;
            --forest: #064E3B;
            --bg-color: #F8FAFC;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: rgba(255, 255, 255, 0.5);
        }
        
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: 
                radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.08), transparent 25%),
                var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Glassmorphism Navbar */
        .navbar-glow {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-glow .navbar-brand {
            color: var(--forest) !important;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-glow .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
            padding: 0.5rem 1.2rem;
            border-radius: 99px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 0 2px;
        }

        .navbar-glow .nav-link:hover, .navbar-glow .nav-link.active {
            color: var(--emerald-dark) !important;
            background: var(--emerald-light);
        }
        
        .navbar-toggler {
            border: none;
            color: var(--forest);
        }

        /* Modern Cards */
        .card-surface {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.02), 
                0 10px 15px -3px rgba(0, 0, 0, 0.04),
                inset 0 0 0 1px rgba(255,255,255,0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .card-surface:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 10px 25px -5px rgba(16, 185, 129, 0.1), 
                0 8px 10px -6px rgba(16, 185, 129, 0.05);
        }

        /* Buttons */
        .btn-success-soft {
            background: var(--emerald);
            color: white;
            border: none;
            border-radius: 99px;
            padding: 0.75rem 1.75rem;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
        }

        .btn-success-soft:hover { 
            background: var(--emerald-dark);
            color: white; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        .btn-outline-success {
            border: 2px solid var(--emerald-light);
            color: var(--emerald-dark);
            border-radius: 99px;
            padding: 0.75rem 1.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            background: transparent;
        }

        .btn-outline-success:hover {
            background: var(--emerald-light);
            color: var(--emerald-dark);
            border-color: var(--emerald-light);
            transform: translateY(-2px);
        }

        /* Badges */
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--emerald-light);
            color: var(--emerald-dark);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }

        .reveal.visible { 
            opacity: 1; 
            transform: translateY(0); 
        }

        /* Modern Footer */
        .footer-basic {
            margin-top: auto;
            padding: 3rem 0 2rem;
            background: white;
            border-top: 1px solid rgba(0,0,0,0.05);
            color: var(--text-muted);
        }

        .footer-basic a { 
            color: var(--text-muted); 
            text-decoration: none; 
            transition: color 0.2s ease;
        }
        
        .footer-basic a:hover {
            color: var(--emerald);
        }

        .footer-basic .social a {
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            width: 40px; 
            height: 40px; 
            margin: 0 8px; 
            border-radius: 50%;
            background: var(--bg-color);
            color: var(--forest);
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .footer-basic .social a:hover {
            background: var(--emerald-light);
            color: var(--emerald-dark);
            transform: translateY(-3px);
        }

        .footer-basic .copyright { 
            font-size: 0.85rem; 
            margin-top: 2rem;
        }
        
        /* Typography refinements */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--forest);
        }
        
        p {
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-glow py-3">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-leaf-fill" style="color: var(--emerald);"></i> PlantCare AI
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/index">AI Engine</a></li>
                    <li class="nav-item"><a class="nav-link" href="/market">Supplements</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block body %}{% endblock body %}
    </main>

    <div class="footer-basic">
        <footer class="container">
            <div class="social text-center mb-4">
                <a target="_blank" href="mailto:krsikx@gmail.com"><i class="bi bi-envelope-fill"></i></a>
                <a target="_blank" href="https://www.instagram.com/krsikx_india/"><i class="bi bi-instagram"></i></a>
                <a target="_blank" href="https://www.linkedin.com/company/krsikx-india-llp/"><i class="bi bi-linkedin"></i></a>
            </div>
            <ul class="list-inline text-center mb-3">
                <li class="list-inline-item"><a href="/">Home</a></li>
                <li class="list-inline-item"><a target="_blank" href="https://www.krsikx.com/">Services</a></li>
                <li class="list-inline-item"><a target="_blank" href="https://www.krsikx.com/copy-of-solutions">About</a></li>
                <li class="list-inline-item"><a href="/index">AI Engine</a></li>
            </ul>
            <p class="copyright text-center mb-0">© <span id="year"></span> PlantCare AI. Crafted for smarter farming.</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.15 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(() => console.log('ServiceWorker registration successful'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
