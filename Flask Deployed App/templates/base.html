<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <meta name="theme-color" content="#059669">
    
    <title>{% block pagetitle %}{% endblock pagetitle %}</title>
    
    <style>
        :root {
            --emerald-50: #ecfdf5;
            --emerald-100: #d1fae5;
            --emerald-200: #a7f3d0;
            --emerald-400: #34d399;
            --emerald: #10b981;
            --emerald-dark: #059669;
            --emerald-900: #064e3b;
            --forest: #064e3b;
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(226, 232, 240, 0.8);
            --shadow-sm: 0 2px 8px -2px rgba(16, 185, 129, 0.08);
            --shadow-md: 0 12px 28px -6px rgba(16, 185, 129, 0.12);
            --shadow-lg: 0 20px 40px -10px rgba(6, 78, 59, 0.15);
        }
        
        html { 
            scroll-behavior: smooth; 
        }
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.07), transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(52, 211, 153, 0.08), transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(5, 150, 105, 0.04), transparent 50%),
                var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--forest);
        }

        /* Modern Glassmorphism Navbar */
        .navbar-glow {
            background: rgba(255, 255, 255, 0.88) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .navbar-glow .navbar-brand {
            color: var(--forest) !important;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .navbar-glow .nav-link {
            color: var(--text-muted) !important;
            font-weight: 600;
            padding: 0.6rem 1.25rem !important;
            border-radius: 99px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 0 3px;
            font-size: 0.95rem;
        }

        .navbar-glow .nav-link:hover {
            color: var(--emerald-dark) !important;
            background: var(--emerald-50);
            transform: translateY(-1px);
        }

        .navbar-glow .nav-link.active {
            color: var(--emerald-dark) !important;
            background: var(--emerald-100);
            font-weight: 700;
        }
        
        .navbar-toggler {
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--emerald-50);
            color: var(--forest);
        }
        
        .navbar-toggler:focus {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
        }

        /* Modern Glass Cards */
        .card-surface {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow-sm);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .card-surface:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-md);
            border-color: rgba(16, 185, 129, 0.3);
        }

        /* Buttons */
        .btn-success-soft {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white !important;
            border: none;
            border-radius: 99px;
            padding: 0.8rem 2rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
            transition: all 0.3s ease;
        }

        .btn-success-soft:hover { 
            background: linear-gradient(135deg, #059669, #047857);
            color: white !important; 
            transform: translateY(-2px); 
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.45);
        }

        .btn-outline-success {
            border: 2px solid var(--emerald);
            color: var(--emerald-dark) !important;
            border-radius: 99px;
            padding: 0.75rem 1.8rem;
            font-weight: 700;
            transition: all 0.3s ease;
            background: transparent;
        }

        .btn-outline-success:hover {
            background: var(--emerald-50);
            color: var(--emerald-dark) !important;
            border-color: var(--emerald-dark);
            transform: translateY(-2px);
        }

        /* Badges */
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            color: var(--emerald-dark);
            padding: 0.55rem 1.2rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(16, 185, 129, 0.25);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.08);
        }

        /* Scroll Animations */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .reveal.visible { 
            opacity: 1; 
            transform: translateY(0); 
        }

        /* Modern Footer */
        .footer-basic {
            margin-top: auto;
            padding: 4rem 0 2.5rem;
            background: white;
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            color: var(--text-muted);
        }

        .footer-basic a { 
            color: var(--text-muted); 
            text-decoration: none; 
            transition: color 0.2s ease;
            font-weight: 500;
        }
        
        .footer-basic a:hover {
            color: var(--emerald-dark);
        }

        .footer-basic .social a {
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            width: 44px; 
            height: 44px; 
            margin: 0 6px; 
            border-radius: 50%;
            background: var(--bg-color);
            color: var(--forest);
            font-size: 1.25rem;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }
        
        .footer-basic .social a:hover {
            background: var(--emerald);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .footer-basic .copyright { 
            font-size: 0.9rem; 
            margin-top: 2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-glow py-3">
        <div class="container">
            <a class="navbar-brand" href="/">
                <div class="brand-icon">
                    <i class="bi bi-leaf-fill"></i>
                </div>
                <span>PlantCare AI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/index' %}active{% endif %}" href="/index">AI Engine</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/market' %}active{% endif %}" href="/market">Supplements</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/contact' %}active{% endif %}" href="/contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block body %}{% endblock body %}
    </main>

    <div class="footer-basic">
        <footer class="container">
            <div class="social text-center mb-4">
                <a target="_blank" href="https://github.com/MeshramYug/Plant_Disease_Detection" title="GitHub Repo"><i class="bi bi-github"></i></a>
                <a target="_blank" href="mailto:krsikx@gmail.com" title="Email"><i class="bi bi-envelope-fill"></i></a>
                <a target="_blank" href="https://www.instagram.com/krsikx_india/" title="Instagram"><i class="bi bi-instagram"></i></a>
                <a target="_blank" href="https://www.linkedin.com/company/krsikx-india-llp/" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
            </div>
            <ul class="list-inline text-center mb-3">
                <li class="list-inline-item mx-3"><a href="/">Home</a></li>
                <li class="list-inline-item mx-3"><a href="/index">AI Engine</a></li>
                <li class="list-inline-item mx-3"><a href="/market">Supplements</a></li>
                <li class="list-inline-item mx-3"><a href="/contact">Contact</a></li>
            </ul>
            <p class="copyright text-center mb-0">© <span id="year"></span> PlantCare AI. Modified by <a href="https://github.com/MeshramYug" class="fw-bold text-success text-decoration-none">Yug Meshram</a>.</p>
        </footer>
    </div>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(() => console.log('ServiceWorker registration successful'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
